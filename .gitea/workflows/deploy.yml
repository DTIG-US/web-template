name: Build and Deploy Angular to Azure Static Web App

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    if: ${{ gitea.event_name == 'push' ||
      (gitea.event_name == 'pull_request' &&
      gitea.event.action != 'closed') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
          NPM_CONFIG_FOREGROUND_SCRIPTS: 'false'

      - name: Build Angular application
        run: npm run build
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
          NPM_CONFIG_FOREGROUND_SCRIPTS: 'false'

      - name: Deploy prebuilt application
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: 'dist/angular-project/browser'
          output_location: ''
          skip_app_build: true
